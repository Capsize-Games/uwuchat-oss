name: Secret Scanning

# Runs on every push to master and every pull request.
#
# Trigger rationale: this repo commits straight to master in normal
# operation (no PR-gated merge flow), so a PR-only trigger would
# silently never run.  `push` to `master` is the primary trigger.
#
# .rooignore protects secrets from the AI coding tool specifically --
# it provides no protection against a human committing a real secret
# by hand. This is that protection.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitleaks/gitleaks-action@v2 requires a paid GITLEAKS_LICENSE for
      # any GitHub *organization* repo (this repo lives under an organization)
      # -- individual-account repos are exempt, orgs are not, regardless
      # of plan. The gitleaks CLI itself is Apache-2.0 and free; only the
      # Marketplace Action wrapper's SaaS-integrated features are gated.
      # Run the CLI directly via its official Docker image instead.
      - name: Run Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --redact --exit-code 1
