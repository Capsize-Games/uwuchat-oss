[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airunner-extensions"
version = "1.0.0"
description = "Extensions for the AI Runner platform"
authors = [{ name = "Capsize Games" }]
requires-python = ">=3.10"

[project.optional-dependencies]
auth = [
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "slowapi>=0.1.9",
    "httpx>=0.28",
]
fastsearch = []
fastsearch-test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
all = [
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "slowapi>=0.1.9",
    "httpx>=0.28",
    "mattermostdriver>=7.3.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "fastsearch/tests",
]
